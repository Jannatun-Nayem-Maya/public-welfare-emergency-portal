{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="card-body">
                    <h4 class="fw-bold text-center mb-4 text-primary">
                        {% if lang == 'bn' %}অ্যাকাউন্টে লগইন করুন{% else %}User Login{% endif %}
                    </h4>
                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">
                                {% if lang == 'bn' %}ইমেইল ঠিকানা{% else %}Email Address{% endif %}
                            </label>
                            <input type="email" name="email" class="form-control" placeholder="user@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                {% if lang == 'bn' %}পাসওয়ার্ড{% else %}Password{% endif %}
                            </label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">
                            {% if lang == 'bn' %}লগইন{% else %}Login{% endif %}
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
