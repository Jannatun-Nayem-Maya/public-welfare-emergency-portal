{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-right-to-bracket text-primary"
                           style="font-size:50px;"></i>

                        <h2 class="fw-bold text-primary mt-3">
                            {% if lang == 'bn' %}
                                লগইন করুন
                            {% else %}
                                Login
                            {% endif %}
                        </h2>

                        <p class="text-muted">
                            Jonoseba Portal
                        </p>

                    </div>


                    <form method="POST">


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- ROLE -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Login As
                            </label>

                            <select
                                name="role"
                                class="form-select"
                                required
                            >

                                <option value="user">
                                    Normal User
                                </option>

                                <option value="student">
                                    Student
                                </option>

                                <option value="volunteer">
                                    Volunteer
                                </option>

                                <option value="admin">
                                    Admin
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100 rounded-pill fw-bold py-2"
                        >

                            <i class="fa-solid fa-right-to-bracket me-2"></i>

                            Login

                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <span class="text-muted">
                            Don't have an account?
                        </span>

                        <a
                            href="{{ url_for('register') }}"
                            class="fw-bold text-primary"
                        >
                            Register
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
